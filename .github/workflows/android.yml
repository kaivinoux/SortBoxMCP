name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "src/renderer/**"
      - "src/shared/**"
      - "src/main/preload.cts"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build, typecheck, and test web app
        run: |
          npm run build
          npx tsc --noEmit
          npm test

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Compile Android APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK artifact
        shell: bash
        run: |
          mkdir -p release/android
          cp android/app/build/outputs/apk/debug/app-debug.apk release/android/IA-For-EveryOne-SortBox-Email-Android.apk
          ls -lh release/android/IA-For-EveryOne-SortBox-Email-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/android/IA-For-EveryOne-SortBox-Email-Android.apk
          retention-days: 30

      - name: Publish Android GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "SortBox E-Mail Android (${{ github.ref_name }})"
          body: |
            Version Android locale (`100 %` sur le téléphone, secrets chiffrés via Android Keystore, index SQLite local).

            Téléchargez et installez **`IA-For-EveryOne-SortBox-Email-Android.apk`** directement sur votre téléphone Android.
          files: release/android/IA-For-EveryOne-SortBox-Email-Android.apk
